# Builds CalLink for Linux (AppImage), Windows (zip) and macOS (universal .dmg).
# Runs when started by hand (Actions tab > Build > Run workflow) or when a v* tag is pushed;
# a tag also publishes the three files as a GitHub Release.
name: Build

on:
  workflow_dispatch:
    inputs:
      os:
        description: Which systems to build
        type: choice
        default: all
        options: [all, linux, windows, macos]
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: rustup update stable && rustup default stable
      - run: cargo test --release

  linux:
    needs: test
    if: github.event_name == 'push' || inputs.os == 'all' || inputs.os == 'linux'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y squashfs-tools
      - run: rustup update stable && rustup default stable
      - run: ./packaging/build-appimage.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*.AppImage

  windows:
    needs: test
    if: github.event_name == 'push' || inputs.os == 'all' || inputs.os == 'windows'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup update stable && rustup default stable
      - run: ./packaging/build-windows.ps1
        shell: pwsh
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*.zip

  macos:
    needs: test
    if: github.event_name == 'push' || inputs.os == 'all' || inputs.os == 'macos'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup update stable && rustup default stable && rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - run: ./packaging/build-macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*.dmg

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows, macos]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "CalLink $GITHUB_REF_NAME" --notes "Downloads for Linux (AppImage), Windows (zip) and macOS (dmg). See the README for setup on each system."
        env:
          GH_TOKEN: ${{ github.token }}
